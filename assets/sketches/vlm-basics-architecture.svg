<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" fill="none">
  <rect width="1400" height="480" fill="#FAFBF8"/>
  <rect x="40" y="40" width="1320" height="400" rx="24" fill="#FFFFFF" stroke="#D8DDD4" stroke-width="2"/>

  <text x="80" y="96" fill="#66717F" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">VLM ARCHITECTURE</text>
  <text x="80" y="140" fill="#151A20" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="850">Three Pieces, Three Jobs</text>
  <text x="80" y="170" fill="#596474" font-family="Manrope, Arial, sans-serif" font-size="17">A vision encoder, an adapter, and an LLM, stacked together.</text>

  <text x="250" y="200" fill="#8a8f98" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.4" text-anchor="middle">INPUT: JPEG PIXELS</text>
  <path d="M250 206V220" stroke="#c7ccd3" stroke-width="2" stroke-linecap="round"/>

  <text x="465" y="200" fill="#8a8f98" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.4" text-anchor="middle">PATCH VECTORS</text>
  <path d="M465 206V220" stroke="#c7ccd3" stroke-width="2" stroke-linecap="round"/>

  <text x="895" y="200" fill="#8a8f98" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.4" text-anchor="middle">ALIGNED VECTORS</text>
  <path d="M895 206V220" stroke="#c7ccd3" stroke-width="2" stroke-linecap="round"/>

  <text x="1110" y="200" fill="#8a8f98" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.4" text-anchor="middle">OUTPUT: TEXT</text>
  <path d="M1110 206V220" stroke="#c7ccd3" stroke-width="2" stroke-linecap="round"/>

  <rect x="80" y="222" width="340" height="118" rx="18" fill="#EEF6FF" stroke="#B7D7F5" stroke-width="2"/>
  <text x="104" y="256" fill="#2B5F96" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="850">Vision Encoder</text>
  <text x="104" y="288" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">pretrained on huge image sets,</text>
  <text x="104" y="312" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">already knows cat from dog</text>

  <path d="M430 281H470" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
  <path d="M446 261L474 281L446 301" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="510" y="222" width="340" height="118" rx="18" fill="#F5F2FF" stroke="#CABDF2" stroke-width="2"/>
  <text x="534" y="256" fill="#5D4BA3" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="850">Adapter</text>
  <text x="534" y="288" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">projects those vectors into</text>
  <text x="534" y="312" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">the LLM's own embedding space</text>

  <path d="M860 281H900" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
  <path d="M876 261L904 281L876 301" stroke="#17202A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="940" y="222" width="340" height="118" rx="18" fill="#F1F8EE" stroke="#BBDDB5" stroke-width="2"/>
  <text x="964" y="256" fill="#2F6E3F" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="850">LLM</text>
  <text x="964" y="288" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">reads translated vision vectors</text>
  <text x="964" y="312" fill="#334155" font-family="Manrope, Arial, sans-serif" font-size="16">next to text, reasons over both</text>

  <rect x="80" y="366" width="1200" height="44" rx="14" fill="#151A20"/>
  <text x="104" y="394" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="850">In short:</text>
  <text x="216" y="394" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="19">vision encoder sees, adapter translates, LLM reasons over both together</text>
</svg>
